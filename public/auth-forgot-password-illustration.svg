<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.55" stop-color="#171717"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f5f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="520" fill="url(#bg)"/>
  <rect width="400" height="520" fill="url(#glow)"/>

  <circle cx="330" cy="70" r="140" fill="#ffffff" opacity="0.05"/>
  <circle cx="60" cy="470" r="120" fill="#ffffff" opacity="0.04"/>

  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="130" x2="400" y2="130"/>
    <line x1="0" y1="260" x2="400" y2="260"/>
    <line x1="0" y1="390" x2="400" y2="390"/>
    <line x1="100" y1="0" x2="100" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="520"/>
    <line x1="300" y1="0" x2="300" y2="520"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="90" width="280" height="170" rx="14" fill="url(#card)"/>
    <circle cx="96" cy="128" r="14" fill="#171717"/>
    <path d="M86 142c2-8 6-12 10-12s8 4 10 12" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="128" y="120" width="90" height="8" rx="4" fill="#d4d4d4"/>
    <rect x="128" y="136" width="60" height="6" rx="3" fill="#e5e5e5"/>
    <rect x="84" y="170" width="232" height="8" rx="4" fill="#e5e5e5"/>
    <rect x="84" y="188" width="232" height="8" rx="4" fill="#e5e5e5"/>
    <rect x="84" y="206" width="140" height="8" rx="4" fill="#e5e5e5"/>
    <rect x="84" y="230" width="180" height="14" rx="7" fill="#171717"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="200" cy="330" r="40" fill="#ffffff"/>
    <rect x="182" y="312" width="36" height="30" rx="6" fill="#262626"/>
    <path d="M192 328h16M196 328v-7a3.5 3.5 0 017 0v7" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="120" cy="390" r="26" fill="#171717"/>
    <rect x="104" y="376" width="16" height="12" rx="3" fill="#ffffff" stroke="#171717" stroke-width="2.5"/>
    <rect x="100" y="378" width="24" height="18" rx="4" fill="#171717"/>
    <rect x="100" y="378" width="24" height="5" fill="#a3a3a3" opacity="0.4"/>
    <circle cx="118" cy="398" r="5" fill="#a3a3a3"/>
  </g>

  <text x="200" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Forgot your password?</text>
  <text x="200" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a3a3a3">We'll email you a reset link</text>
</svg>
